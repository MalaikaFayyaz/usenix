# @Encoding:      UTF-8
# @File:          celeba_hq_identity_random_untrained_kaiming_normal_resnet18_pruning_magnitude_0.7.yaml
#
# @Introduction:  config of randomly sampling CelebA-HQ-Identity, for untrained resnet18 with Kaiming Normal Initialization, 
#                 but user will introduce gradient pruning with ratio 70%.
# @Author:        Kaiming Zhu
# @Date:          2024/5/25 16:40

name: celeba_hq_identity_random_untrained_kaiming_normal_resnet18_pruning_magnitude_0.7

defaults:
  - data: celeba_hq_identity_random
  - impl: default
  - server: honest-but-curious_kaiming_normal
  - user: local_gradient_pruning_0.9
  - _self_

model: ResNet18
model_nickname: ResNet18-kaiming_normal(pruning 70%)

# Server and user:
num_queries: 1

user:
  local_diff_privacy:
    gradient_noise: 0.0
    input_noise: 0.0
    distribution: laplacian
    per_example_clipping: 0.0
    pruning_ratio: 0.7