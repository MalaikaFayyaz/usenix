# @Encoding:      UTF-8
# @File:          cifar100_trained_random.yaml
#
# @Introduction:  config of randomly sampling cifar100, for pretrained-resnet in hf_hub:edadaltocg.
# @Author:        Kaiming Zhu
# @Date:          2024/5/25 16:08
# @Reference:     https://huggingface.co/edadaltocg/resnet18_cifar100/blob/main/config.json
# @Notes:         Mean and Std would be different to other cifar-configs, plz see reference for more detail.

name: CIFAR100
modality: vision
task: classification

path: "~/data"
size: 50_000
classes: 100
shape:
  - 3
  - 32
  - 32

normalize: True
mean:
  - 0.5071
  - 0.4867
  - 0.4408
std:
  - 0.2675
  - 0.2565
  - 0.2761

augmentations_train:
  RandomCrop:
    - 32
    - 4
  RandomHorizontalFlip: 0.5
augmentations_val:

# Federated Learning specifics:
default_clients: 100
partition: random
examples_from_split: validation

# Data-specific implementation constants:
batch_size: 128
caching: False
defaults:
  - db: none # Database Setup # use the cmd-line to activate the LMDB module with data.db=LMDB
