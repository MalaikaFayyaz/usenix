name: celeba_hq_identity_random_untrained_kaiming_normal_resnet18_batch_8_epoch_2

defaults:
  - data: celeba_hq_identity_random
  - impl: default
  - server: honest-but-curious_kaiming_normal
  - user: local_updates_lr1e-4
  - _self_

model: ResNet18
model_nickname: ResNet18-kaiming_normal(batch 8, epoch 2)

# Server and user:
num_queries: 1

user:
  user_idx: 0
  provide_labels: False

  num_data_points: 8
  num_data_per_local_update_step: 8

  num_local_updates: 2
